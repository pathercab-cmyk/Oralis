<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador - Oralis</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; padding: 30px; background: #F8F9FA; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #E2E8E0; text-align: left; }
        th { background: #2E6B52; color: white; }
    </style>
</head>
<body>
    <h2>Panel de Administración de Oralis</h2>
    <p>Total de usuarios registrados: <strong>{{ total_usuarios }}</strong></p>
    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Puntuación</th>
                <th>Comentario</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody>
            {% for fb in feedbacks %}
            <tr>
                <td>{{ fb.usuario_email }}</td>
                <td>{{ fb.puntuacion }} ⭐</td>
                <td>{{ fb.comentario }}</td>
                <td>{{ fb.fecha_creacion }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No hay feedback registrado aún.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
