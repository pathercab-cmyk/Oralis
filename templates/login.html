<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oralis - Acceso y Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-main: #F5F7F5;
            --card-bg: #FFFFFF;
            --accent-green: #2E6B52;
            --accent-green-hover: #23533F;
            --accent-coral: #E07A5F;
            --text-dark: #2C3E35;
            --border-color: #E2E8E0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(46, 107, 82, 0.06);
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            background-color: var(--accent-green);
            color: #FFFFFF;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 auto 1.2rem auto;
            box-shadow: 0 6px 16px rgba(46, 107, 82, 0.25);
        }

        .nav-pills {
            background-color: #EEF2EE;
            padding: 4px;
            border-radius: 12px;
        }

        .nav-pills .nav-link {
            color: #6C7A72;
            font-weight: 600;
            border-radius: 9px;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background-color: var(--accent-green);
            color: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-control {
            background-color: #FBFDFB;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(46, 107, 82, 0.15);
        }

        .btn-green {
            background-color: var(--accent-green);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-green:hover {
            background-color: var(--accent-green-hover);
            color: #FFFFFF;
        }

        .btn-coral {
            background-color: var(--accent-coral);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-coral:hover {
            background-color: #D0694E;
            color: #FFFFFF;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-icon"><i class="bi bi-chat-quote-fill"></i></div>
    <h4 class="fw-bold text-center mb-1">Oralis</h4>
    <p class="text-muted small text-center mb-4">Tu tutor inteligente de idiomas personalizado</p>

    <!-- Pestañas de Login / Registro -->
    <ul class="nav nav-pills nav-justified mb-4" id="authTabs">
        <li class="nav-item">
            <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#pane-login">Iniciar Sesión</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#pane-register">Crear Cuenta</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <div class="tab-pane fade show active" id="pane-login">
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Correo Electrónico</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Contraseña</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-green">Entrar a Oralis</button>
            </form>
        </div>

        <!-- FORMULARIO DE REGISTRO (SIN NIVEL CEFR) -->
        <div class="tab-pane fade" id="pane-register">
            <form id="formRegister">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Nombre de Usuario</label>
                    <input type="text" id="regUser" class="form-control" placeholder="Ej: maria_l" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Correo Electrónico</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Contraseña</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-coral">Registrarme</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Iniciar Sesión
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.status === 'ok') {
            window.location.href = '/';
        } else {
            alert(data.message || 'Error al iniciar sesión');
        }
    });

    // Registrar Usuario
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('regUser').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();
        if (data.status === 'ok') {
            window.location.href = '/';
        } else {
            alert(data.message || 'Error en el registro');
        }
    });
</script>
</body>
</html>
