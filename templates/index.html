<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oralis - Tutor Virtual de Idiomas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .chat-box { height: 60vh; overflow-y: auto; background: #ffffff; border-radius: 8px; padding: 20px; border: 1px solid #dee2e6; }
        .msg-user { background-color: #e3f2fd; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .msg-tutor { background-color: #f8f9fa; border-left: 4px solid #0d6efd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .tag-box { background-color: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin-top: 8px; }
        .pulse-recording { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0px rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-translate"></i> Oralis</a>
        <div class="d-flex align-items-center text-white">
            <span class="me-3">Hola, <strong>{{ user_name }}</strong></span>
            <button class="btn btn-sm btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#notebookModal" onclick="loadNotebook()"><i class="bi bi-journal-bookmark"></i> Mi Cuaderno</button>
            <button class="btn btn-sm btn-light text-primary" onclick="clearChat()"><i class="bi bi-trash"></i> Limpiar Chat</button>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row g-3">
        <!-- Panel de Configuración -->
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Configuración</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Idioma Objetivo</label>
                        <select id="target_lang" class="form-select">
                            <optgroup label="Idiomas Principales">
                                <option value="Inglés" selected>Inglés</option>
                                <option value="Español (ELE)">Español como Idioma Extranjero (ELE)</option>
                                <option value="Francés">Francés</option>
                                <option value="Alemán">Alemán</option>
                                <option value="Italiano">Italiano</option>
                                <option value="Portugués">Portugués</option>
                            </optgroup>
                            <optgroup label="Lenguas Antiguas y Clásicas">
                                <option value="Latín">Latín</option>
                                <option value="Griego Antiguo">Griego Antiguo / Clásico</option>
                            </optgroup>
                            <optgroup label="Idiomas Europeos">
                                <option value="Neerlandés">Neerlandés / Holandés</option>
                                <option value="Ruso">Ruso</option>
                                <option value="Polaco">Polaco</option>
                                <option value="Sueco">Sueco</option>
                                <option value="Noruego">Noruego</option>
                                <option value="Danés">Danés</option>
                                <option value="Finés">Finés</option>
                                <option value="Griego">Griego Moderno</option>
                                <option value="Turco">Turco</option>
                                <option value="Checo">Checo</option>
                                <option value="Rumano">Rumano</option>
                                <option value="Húngaro">Húngaro</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nivel CEFR</label>
                        <select id="cefr_level" class="form-select">
                            <option value="A1">A1 - Principiante</option>
                            <option value="A2">A2 - Elemental</option>
                            <option value="B1" selected>B1 - Intermedio</option>
                            <option value="B2">B2 - Intermedio Alto</option>
                            <option value="C1">C1 - Avanzado</option>
                            <option value="C2">C2 - Maestría</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Modo de Trabajo</label>
                        <select id="mode" class="form-select" onchange="toggleModeFields()">
                            <option value="tutor_general">Tutor General</option>
                            <option value="practica_oral">Práctica Oral (Simulación)</option>
                            <option value="examenes">Preparación de Exámenes</option>
                            <option value="writing">Expresión Escrita</option>
                        </select>
                    </div>

                    <div id="field_practica" class="mb-3 d-none">
                        <label class="form-label">Rol para Simulación</label>
                        <input type="text" id="rol_practica" class="form-control" placeholder="Ej: Entrevistador de trabajo">
                    </div>

                    <div id="field_examenes" class="mb-3 d-none">
                        <label class="form-label">Examen / Rúbrica</label>
                        <input type="text" id="examen_oficial" class="form-control mb-2" placeholder="Ej: Cambridge B2 First">
                        <textarea id="rubrica" class="form-control" rows="2" placeholder="Criterios o rúbrica..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Principal -->
        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div id="chat_box" class="chat-box mb-3">
                        <div class="msg-tutor">
                            <strong><i class="bi bi-robot"></i> Oralis:</strong>
                            <p class="mb-0 mt-1">¡Hola! Soy tu tutor de idiomas. ¿Qué te gustaría practicar hoy?</p>
                        </div>
                    </div>

                    <div class="input-group">
                        <textarea id="user_message" class="form-control" placeholder="Escribe o habla en tu idioma objetivo..." rows="2"></textarea>
                        
                        <!-- Micrófono -->
                        <button type="button" id="mic_btn" class="btn btn-outline-secondary" onclick="toggleMic()" title="Hablar por micrófono">
                            <i class="bi bi-mic-fill"></i>
                        </button>
                        
                        <!-- Enviar -->
                        <button type="button" class="btn btn-primary" onclick="sendMessage()">
                            <i class="bi bi-send-fill"></i> Enviar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Mi Cuaderno -->
<div class="modal fade" id="notebookModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-journal-bookmark"></i> Mi Cuaderno</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" id="notebookTab" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#vocabTab">Vocabulario</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#grammarTab">Gramática</button></li>
                </ul>
                <div class="tab-content p-3">
                    <div class="tab-pane fade show active" id="vocabTab"><ul id="vocab_list" class="list-group"></ul></div>
                    <div class="tab-pane fade" id="grammarTab"><ul id="grammar_list" class="list-group"></ul></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// MAPEO DE IDIOMAS Y CÓDIGOS ISO/BCP47
const langCodes = {
    "Inglés": "en-US",
    "Español (ELE)": "es-ES",
    "Francés": "fr-FR",
    "Alemán": "de-DE",
    "Italiano": "it-IT",
    "Portugués": "pt-PT",
    "Latín": "la",
    "Griego Antiguo": "el-GR",
    "Neerlandés": "nl-NL",
    "Ruso": "ru-RU",
    "Polaco": "pl-PL",
    "Sueco": "sv-SE",
    "Noruego": "no-NO",
    "Danés": "da-DK",
    "Finés": "fi-FI",
    "Griego": "el-GR",
    "Turco": "tr-TR",
    "Checo": "cs-CZ",
    "Rumano": "ro-RO",
    "Húngaro": "hu-HU"
};

// ALTAVOZ (TEXT-TO-SPEECH)
function speakText(text) {
    if (!('speechSynthesis' in window)) {
        alert("Tu navegador no soporta reproducción de voz.");
        return;
    }
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/\[.*?\]/g, '').trim();
    const utterance = new SpeechSynthesisUtterance(cleanText);
    const selectedLang = document.getElementById("target_lang").value;
    utterance.lang = langCodes[selectedLang] || "en-US";
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

// MICRÓFONO (SPEECH-TO-TEXT)
let recognition = null;
let isRecording = false;

function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Tu navegador no soporta el reconocimiento de voz. Usa Chrome o Edge.");
        return;
    }

    const micBtn = document.getElementById("mic_btn");
    const messageInput = document.getElementById("user_message");

    if (isRecording) {
        if (recognition) recognition.stop();
        return;
    }

    recognition = new SpeechRecognition();
    const selectedLang = document.getElementById("target_lang").value;
    recognition.lang = langCodes[selectedLang] || "en-US";
    recognition.interimResults = false;

    recognition.onstart = function() {
        isRecording = true;
        micBtn.classList.remove("btn-outline-secondary");
        micBtn.classList.add("btn-danger", "pulse-recording");
        micBtn.innerHTML = '<i class="bi bi-mic-mute-fill"></i> Escuchando...';
    };

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        messageInput.value = (messageInput.value ? messageInput.value + " " : "") + transcript;
    };

    recognition.onerror = stopRecordingState;
    recognition.onend = stopRecordingState;
    recognition.start();
}

function stopRecordingState() {
    isRecording = false;
    const micBtn = document.getElementById("mic_btn");
    micBtn.classList.remove("btn-danger", "pulse-recording");
    micBtn.classList.add("btn-outline-secondary");
    micBtn.innerHTML = '<i class="bi bi-mic-fill"></i>';
}

function toggleModeFields() {
    const mode = document.getElementById("mode").value;
    document.getElementById("field_practica").classList.toggle("d-none", mode !== "practica_oral");
    document.getElementById("field_examenes").classList.toggle("d-none", mode !== "examenes");
}

async function sendMessage() {
    const input = document.getElementById("user_message");
    const message = input.value.trim();
    if (!message) return;

    const chatBox = document.getElementById("chat_box");
    
    // Añadir mensaje de usuario
    chatBox.innerHTML += `<div class="msg-user"><strong>Tú:</strong><p class="mb-0 mt-1">${message}</p></div>`;
    input.value = "";

    // Contenedor respuesta tutor
    const tutorMsgDiv = document.createElement("div");
    tutorMsgDiv.className = "msg-tutor";
    tutorMsgDiv.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-1">
            <strong><i class="bi bi-robot"></i> Oralis:</strong>
            <button class="btn btn-sm btn-link text-dark p-0" onclick="speakText(this.closest('.msg-tutor').innerText)" title="Escuchar">
                <i class="bi bi-volume-up-fill fs-5"></i>
            </button>
        </div>
        <div class="content">...</div>`;
    chatBox.appendChild(tutorMsgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    const contentDiv = tutorMsgDiv.querySelector(".content");

    const payload = {
        message: message,
        target_lang: document.getElementById("target_lang").value,
        cefr_level: document.getElementById("cefr_level").value,
        mode: document.getElementById("mode").value,
        rol_practica: document.getElementById("rol_practica").value,
        examen_oficial: document.getElementById("examen_oficial").value,
        rubrica: document.getElementById("rubrica").value
    };

    const response = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    contentDiv.innerHTML = "";

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        contentDiv.innerHTML += decoder.decode(value);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

async function clearChat() {
    await fetch("/clear_chat", { method: "POST" });
    document.getElementById("chat_box").innerHTML = `
        <div class="msg-tutor">
            <strong><i class="bi bi-robot"></i> Oralis:</strong>
            <p class="mb-0 mt-1">Historial borrado. ¿Qué quieres practicar ahora?</p>
        </div>`;
}

async function loadNotebook() {
    const res = await fetch("/get_notebook");
    const data = await res.json();
    const vocabList = document.getElementById("vocab_list");
    const grammarList = document.getElementById("grammar_list");

    vocabList.innerHTML = data.notebook.vocabulary.length ? 
        data.notebook.vocabulary.map(item => `<li class="list-group-item">${item}</li>`).join("") : 
        "<li class='list-group-item text-muted'>Sin vocabulario guardado.</li>";

    grammarList.innerHTML = data.notebook.grammar.length ? 
        data.notebook.grammar.map(item => `<li class="list-group-item">${item}</li>`).join("") : 
        "<li class='list-group-item text-muted'>Sin reglas gramaticales guardadas.</li>";
}
</script>
</body>
</html>
